<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Pro SaaS - Gestión Integral</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h2>🛠️ Mi Taller Cloud</h2>
            <p>Accede a tu taller privado</p>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-password" placeholder="Contraseña">
            <div class="flex-row">
                <button id="btn-login-action" class="btn-success">Entrar</button>
                <button id="btn-register-action" class="btn-primary">Registrarse</button>
            </div>
            <p id="auth-error" class="error-text"></p>
        </div>
    </div>

    <div id="app-content" class="container" style="display:none;">
        <header>
            <div class="header-flex">
                <h1>Gestión de Taller</h1>
                <button id="btn-logout-action" class="btn-logout">Cerrar Sesión</button>
            </div>
        </header>

        <main>
            <section class="card">
                <h3>⚙️ Categorías</h3>
                <div class="flex-row">
                    <input type="text" id="new-category-name" placeholder="Ej: Pintura, Motor...">
                    <button id="btn-add-category" class="btn-primary">Añadir</button>
                </div>
                <div id="category-tags" class="tags-container"></div>
            </section>

            <section class="card">
                <h3>📦 Inventario y Herramientas</h3>
                <form id="tool-form" class="flex-row">
                    <input type="text" id="tool-name" placeholder="Herramienta" required>
                    <input type="text" id="tool-location" placeholder="Ubicación">
                    <select id="tool-category-select"></select>
                    <button type="submit" class="btn-success">Guardar</button>
                </form>
                <div id="tool-list" class="grid-container"></div>
            </section>

            <section class="card budget-area">
                <h2>💰 Calculadora de Presupuesto</h2>
                <div class="budget-grid">
                    <div class="group">
                        <label>Cliente</label>
                        <input type="text" id="client-name" placeholder="Nombre completo">
                    </div>
                    <div class="group">
                        <label>Ajustes ($ Hora / % Gastos)</label>
                        <div class="flex-row">
                            <input type="number" id="hourly-rate" value="25">
                            <input type="number" id="overhead-percent" value="10">
                        </div>
                    </div>
                </div>

                <div class="flex-row budget-inputs">
                    <input type="text" id="budget-item" placeholder="Descripción">
                    <input type="number" id="budget-price" placeholder="Costo/Horas">
                    <select id="item-type">
                        <option value="Material">📦 Material (+20% Margen)</option>
                        <option value="Labor">👨‍🔧 Mano de Obra (Horas)</option>
                    </select>
                    <button id="btn-add-budget-item" class="btn-primary">Añadir Item</button>
                </div>

                <div id="budget-list" class="budget-table"></div>

                <div class="results-bar">
                    <p>Subtotal: <span id="subtotal-val">$0.00</span></p>
                    <p>Gastos: <span id="tax-val">$0.00</span></p>
                    <h3>Total: <strong id="total-budget">$0.00</strong></h3>
                </div>

                <div class="flex-row" style="margin-top:15px;">
                    <button id="btn-generate-pdf" class="btn-primary">📄 Descargar PDF</button>
                    <button id="btn-finish-work" class="btn-success">✅ Finalizar y Cobrar</button>
                </div>
            </section>

            <section class="card">
                <h3>📊 Ganancias del Mes</h3>
                <div class="stats-card green">
                    <strong id="monthly-earnings-total">$0.00</strong>
                </div>
                <button id="btn-delete-selected" class="btn-logout" style="margin: 10px 0;">Eliminar Seleccionados</button>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all-history"></th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
