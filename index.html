<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Pro Cloud - Seguridad Total</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h2>🔐 Acceso al Taller</h2>
            <p>Introduce tus credenciales de Firebase</p>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-password" placeholder="Contraseña">
            <button onclick="login()" class="btn-success">Iniciar Sesión</button>
            <p id="auth-error" style="color:red; display:none; margin-top:10px;">Error: Verifica tus datos</p>
        </div>
    </div>

    <div id="app-content" class="container" style="display:none;">
        <header>
            <div>
                <h1>🛠️ Taller Cloud</h1>
                <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
            </div>
            <div class="stats-card">
                <span>Ganancias del Mes:</span>
                <strong id="monthly-earnings">$0.00</strong>
            </div>
        </header>

        <main>
            <section class="card">
                <h3>📁 Configurar Categorías</h3>
                <div class="flex-row">
                    <input type="text" id="new-category-name" placeholder="Ej: Carpintería">
                    <button onclick="addCategory()" class="btn-primary">Añadir</button>
                </div>
                <div id="category-tags" class="tags-container"></div>
            </section>

            <section class="card">
                <h3>📝 Nueva Herramienta</h3>
                <form id="tool-form" class="flex-row">
                    <input type="text" id="tool-name" placeholder="Nombre" required>
                    <select id="tool-category-select" required></select>
                    <button type="submit" class="btn-success">Guardar</button>
                </form>
            </section>

            <section>
                <input type="text" id="search-bar" placeholder="🔍 Buscar por nombre o poseedor...">
                <div id="tool-list" class="grid-container"></div>
            </section>

            <section class="card budget-area">
                <h2>💰 Generador de Presupuestos</h2>
                <div class="flex-row">
                    <input type="text" id="budget-item" placeholder="Descripción">
                    <input type="number" id="budget-price" placeholder="Precio">
                    <button onclick="addBudgetItem()" class="btn-primary">Añadir</button>
                </div>
                <table id="budget-table">
                    <thead>
                        <tr><th>Descripción</th><th>Precio</th><th></th></tr>
                    </thead>
                    <tbody id="budget-body"></tbody>
                </table>
                <div class="budget-footer">
                    <input type="text" id="client-name" placeholder="Nombre del Cliente">
                    <div class="total-box">
                        <h3>Total: $<span id="budget-total">0.00</span></h3>
                        <button onclick="processAndSaveBudget()" class="btn-pdf">📄 Descargar PDF y Guardar</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
