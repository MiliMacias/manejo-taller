<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Pro SaaS - Sistema de Gestión</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h2>🛠️ Mi Taller Cloud</h2>
            <p>Accede o crea tu taller privado</p>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-password" placeholder="Contraseña">
            <div class="flex-row">
                <button onclick="login()" class="btn-success">Entrar</button>
                <button onclick="register()" class="btn-primary">Registrarse</button>
            </div>
            <p id="auth-error" class="error-text"></p>
        </div>
    </div>

    <div id="app-content" class="container" style="display:none;">
        <header>
            <div>
                <h1>Gestión de Taller</h1>
                <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
            </div>
            <div class="stats-card">
                <span>Ganancias Acumuladas:</span>
                <strong id="monthly-earnings">$0.00</strong>
            </div>
        </header>

        <main>
            <section class="card">
                <h3>⚙️ Mis Categorías Personalizadas</h3>
                <div class="flex-row">
                    <input type="text" id="new-category-name" placeholder="Nueva categoría (ej. Pintura)">
                    <button onclick="addCategory()" class="btn-primary">Añadir</button>
                </div>
                <div id="category-tags" class="tags-container"></div>
            </section>

            <section class="card">
                <h3>📦 Inventario y Ubicación</h3>
                <form id="tool-form" class="flex-row">
                    <input type="text" id="tool-name" placeholder="Nombre herramienta" required>
                    <input type="text" id="tool-location" placeholder="Ubicación (Ej: Estante A1)">
                    <select id="tool-category-select"></select>
                    <button type="submit" class="btn-success">Guardar</button>
                </form>
                <input type="text" id="search-bar" placeholder="🔍 Buscar por nombre, ubicación o poseedor...">
                <div id="tool-list" class="grid-container"></div>
            </section>

            <section class="card budget-area">
                <h2>💰 Calculadora de Presupuesto Profesional</h2>
                <div class="budget-grid">
                    <div class="group">
                        <label>Datos del Cliente</label>
                        <input type="text" id="client-name" placeholder="Nombre completo">
                        <input type="text" id="client-info" placeholder="Teléfono / Dirección">
                    </div>
                    <div class="group">
                        <label>Ajustes de Costos</label>
                        <div class="flex-row">
                            <input type="number" id="hourly-rate" placeholder="Valor Hora ($)" value="25">
                            <input type="number" id="overhead-percent" placeholder="Gasto Fijo (%)" value="10">
                        </div>
                    </div>
                </div>

                <div class="flex-row budget-inputs">
                    <input type="text" id="budget-item" placeholder="Descripción">
                    <input type="number" id="budget-price" placeholder="Costo/Horas">
                    <select id="item-type">
                        <option value="Material">📦 Material (+20% Margen)</option>
                        <option value="Labor">👨‍🔧 Mano de Obra (Horas)</option>
                    </select>
                    <button onclick="addBudgetItem()" class="btn-primary">Añadir Item</button
<script type="module" src="main.js"></script>
</html>
