<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Pro</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h2>🛠️ Mi Taller Cloud</h2>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-password" placeholder="Contraseña">
            <div class="flex-row">
                <button onclick="login()" class="btn-success">Entrar</button>
                <button onclick="register()" class="btn-primary">Crear Taller</button>
            </div>
        </div>
    </div>

    <div id="app-content" class="container" style="display:none;">
        <header>
            <div>
                <h1 id="user-workshop-title">Mi Taller</h1>
                <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
            </div>
            <div class="stats-card">
                <span>Ganancias Reales:</span>
                <strong id="monthly-earnings">$0.00</strong>
            </div>
        </header>

        <main>
            <section class="card">
                <h3>⚙️ Datos de mi Taller (Para el PDF)</h3>
                <div class="flex-row">
                    <input type="text" id="ws-name" placeholder="Nombre del Taller">
                    <input type="text" id="ws-phone" placeholder="Teléfono">
                    <input type="text" id="ws-address" placeholder="Dirección">
                    <button onclick="saveWorkshopData()" class="btn-primary">Guardar Datos</button>
                </div>
            </section>

            <section class="card">
                <h3>📦 Inventario y Categorías</h3>
                <div class="category-manager">
                    <input type="text" id="new-category-name" placeholder="Nueva Categoría">
                    <button onclick="addCategory()" class="btn-primary">Añadir</button>
                    <select id="delete-category-select"></select>
                    <button onclick="deleteCategory()" class="btn-danger">Eliminar</button>
                </div>

                <form id="tool-form" class="flex-row">
                    <input type="text" id="tool-name" placeholder="Herramienta" required>
                    <input type="text" id="tool-location" placeholder="Ubicación">
                    <select id="tool-category-select"></select>
                    <button type="submit" id="submit-tool-btn" class="btn-success">Añadir Herramienta</button>
                </form>

                <div class="flex-row">
                    <input type="text" id="search-bar" placeholder="🔍 Buscar...">
                    <select id="filter-category" onchange="renderTools()">
                        <option value="Todas">Todas las categorías</option>
                    </select>
                </div>
                <div id="tool-list" class="grid-container"></div>
            </section>

            <section class="card budget-area">
                <h2>💰 Calculadora de Presupuesto</h2>
                <div class="budget-grid">
                    <div class="group">
                        <label>Datos del Cliente</label>
                        <input type="text" id="client-name" placeholder="Nombre del Cliente">
                        <input type="text" id="client-contact" placeholder="Teléfono/Email Cliente" style="margin-top:5px">
                    </div>
                    <div class="group">
                        <label>Costos Base</label>
                        <div class="flex-row">
                            <input type="number" id="hourly-rate" value="20" title="Valor Hora">
                            <input type="number" id="overhead-percent" value="10" title="% Gastos Fijos">
                        </div>
                    </div>
                </div>

                <div class="flex-row">
                    <input type="text" id="budget-item" placeholder="Descripción">
                    <input type="number" id="budget-price" placeholder="Costo/Horas">
                    <select id="item-type">
                        <option value="Material">📦 Material (+20%)</option>
                        <option value="Labor">👨‍🔧 Mano Obra (Hs)</option>
                    </select>
                    <button onclick="addBudgetItem()" class="btn-primary">Añadir</button>
                </div>

                <table class="history-table">
                    <thead>
                        <tr><th>Tipo</th><th>Detalle</th><th>Costo/Hs</th><th>Acción</th></tr>
                    </thead>
                    <tbody id="budget-body"></tbody>
                </table>

                <div class="total-box">
                    <p>Subtotal: $<span id="subtotal-val">0.00</span></p>
                    <h3>TOTAL: $<span id="budget-total">0.00</span></h3>
                    <button onclick="processAndSaveBudget()" class="btn-pdf">Generar PDF y Guardar</button>
                </div>
            </section>

            <section class="card">
                <h3>📋 Historial de Presupuestos</h3>
                <div class="table-responsive">
                    <table class="history-table">
                        <thead>
                            <tr><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr>
                        </thead>
                        <tbody id="history-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>

    <script type="module" src="main.js"></script>
</body>

</html>
