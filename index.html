<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Pro SaaS - Gestión Multiusuario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div id="login-screen" class="auth-overlay">
        <div class="auth-card">
            <h2>🛠️ Mi Taller Cloud</h2>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-password" placeholder="Contraseña">
            <div class="flex-row">
                <button onclick="login()" class="btn-success">Entrar</button>
                <button onclick="register()" class="btn-primary">Crear Taller</button>
            </div>
            <p id="auth-error" style="color:red; display:none;"></p>
        </div>
    </div>

    <div id="app-content" class="container" style="display:none;">
        <header>
            <div>
                <h1 id="user-workshop-title">Mi Taller</h1>
                <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
            </div>
            <div class="stats-card">
                <span>Ganancias Mes:</span>
                <strong id="monthly-earnings">$0.00</strong>
            </div>
        </header>

        <main>
            <section class="card">
                <h3>📦 Inventario y Ubicación</h3>
                <form id="tool-form" class="flex-row">
                    <input type="text" id="tool-name" placeholder="Herramienta" required>
                    <input type="text" id="tool-location" placeholder="Ubicación (Ej: Estante B2)">
                    <select id="tool-category-select"></select>
                    <button type="submit" class="btn-success">Añadir</button>
                </form>
                <input type="text" id="search-bar" placeholder="🔍 Buscar por nombre, poseedor o ubicación...">
                <div id="tool-list" class="grid-container"></div>
            </section>

            <section class="card budget-area">
                <h2>💰 Calculadora de Presupuesto Profesional</h2>
                <div class="budget-grid">
                    <div class="group">
                        <label>Cliente</label>
                        <input type="text" id="client-name" placeholder="Nombre">
                        <input type="text" id="client-info" placeholder="Contacto">
                    </div>
                    <div class="group">
                        <label>Configuración de Costos</label>
                        <input type="number" id="hourly-rate" placeholder="Valor Hora ($)" value="20">
                        <input type="number" id="overhead-percent" placeholder="Gasto Fijo (%)" value="10">
                    </div>
                </div>

                <div class="flex-row">
                    <input type="text" id="budget-item" placeholder="Descripción">
                    <input type="number" id="budget-price" placeholder="Costo Base">
                    <select id="item-type">
                        <option value="Material">📦 Material (incluye +20% margen)</option>
                        <option value="Labor">👨‍🔧 Mano de Obra (horas)</option>
                    </select>
                    <button onclick="addBudgetItem()" class="btn-primary">Añadir</button>
                </div>

                <table id="budget-table">
                    <thead>
                        <tr><th>Tipo</th><th>Detalle</th><th>Costo</th><th>Acción</th></tr>
                    </thead>
                    <tbody id="budget-body"></tbody>
                </table>

                <div class="total-box">
                    <p>Subtotal: $<span id="subtotal-val">0.00</span></p>
                    <h3>TOTAL ESTIMADO: $<span id="budget-total">0.00</span></h3>
                    <button onclick="processAndSaveBudget()" class="btn-pdf">Generar e Imprimir</button>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
